[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-kitchen-data"
version = "0.1.0"
requires-python = ">=3.12"
# The three pins constrain each other, and match the consumer projects.
dependencies = [
    "mujoco==3.11.0",
    "gymnasium==1.3.0",
    "gymnasium-robotics==1.4.2",
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
collect = ["pygame"]

[tool.setuptools]
packages = ["franka_kitchen_data"]
